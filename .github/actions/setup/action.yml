name: Compose toolchain
description: >
  The stack in docs/building.md on the runner itself: apt KiCad 7 and its Python 3.12, OpenJDK 21 first on
  PATH (the image defaults to Java 17, which Freerouting 2.1.0 can't run on), Freerouting 2.1.0, ngspice,
  requirements.txt. Also Java 25 and Freerouting 2.5.0, for the boards a layout routes with that version:
  compose/pcb/toolbox.py finds them by JAVA_HOME_25_<arch> and beside the default jar.
runs:
  using: composite
  steps:
    - name: Java 25 (before the apt step, which puts Java 21 first on PATH again)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"
    # Every download and install below has a time limit (limit.sh): one that stalls is stopped and fails the job
    # with an error saying what stalled, in place of the job waiting out its own limit and being cancelled.
    # The packages' .deb files are kept in the Actions cache: the Ubuntu mirror a runner is given can take half an
    # hour over them (KiCad, its footprints and Java are 100 MB of the download), and a job that waits that long
    # runs into its time limit. The cache is named after the exact files apt wants, so a new version of any
    # package makes a new cache; apt checks every file against its index and downloads again what does not match.
    - name: apt index, and the package files this runner needs
      id: apt
      shell: bash
      env:
        APT_PACKAGES: >-
          kicad kicad-footprints kicad-symbols python3-pip python3-dev openjdk-21-jre-headless ngspice
          fonts-dejavu-core
      run: |
        bash "$GITHUB_ACTION_PATH/limit.sh" 180 "Refreshing the package index (apt-get update)" sudo apt-get update -q
        sudo apt-get install -qq --print-uris --no-install-recommends $APT_PACKAGES \
            | awk '{print $2}' | sort > "$RUNNER_TEMP/apt-debs.txt"
        echo "packages=$APT_PACKAGES" >> "$GITHUB_OUTPUT"
        echo "key=apt-debs-$(dpkg --print-architecture)-$(sha256sum < "$RUNNER_TEMP/apt-debs.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: apt package files from the cache
      id: debs
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-debs
        key: ${{ steps.apt.outputs.key }}
        restore-keys: apt-debs-
    - name: apt packages
      shell: bash
      run: |
        mkdir -p ~/apt-debs
        had=0
        while read -r f; do
          if [ -f ~/apt-debs/"$f" ]; then sudo cp ~/apt-debs/"$f" /var/cache/apt/archives/; had=$((had + 1)); fi
        done < "$RUNNER_TEMP/apt-debs.txt"
        echo "apt: $had of $(wc -l < "$RUNNER_TEMP/apt-debs.txt" | tr -d ' ') package files came from the cache"
        # download first, and keep the files: whatever the image does with them after an install
        bash "$GITHUB_ACTION_PATH/limit.sh" 300 "Downloading the apt packages" \
            sudo apt-get install -y -q --no-install-recommends --download-only ${{ steps.apt.outputs.packages }}
        rm -f ~/apt-debs/*.deb
        while read -r f; do
          cp /var/cache/apt/archives/"$f" ~/apt-debs/ || echo "::warning::apt: $f is not in apt's archive folder, so it is not cached"
        done < "$RUNNER_TEMP/apt-debs.txt"
        bash "$GITHUB_ACTION_PATH/limit.sh" 300 "Installing the apt packages" \
            sudo apt-get install -y -q --no-install-recommends ${{ steps.apt.outputs.packages }}
        J21=/usr/lib/jvm/java-21-openjdk-$(dpkg --print-architecture)/bin
        echo "$J21" >> "$GITHUB_PATH"
    - name: keep the apt package files (when this exact set was not cached yet)
      if: steps.debs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/apt-debs
        key: ${{ steps.apt.outputs.key }}
    - name: Freerouting cache
      uses: actions/cache@v4
      with:
        path: ~/tools/freerouting.jar
        key: freerouting-2.1.0
    - name: Freerouting 2.1.0
      shell: bash
      run: |
        mkdir -p ~/tools
        [ -f ~/tools/freerouting.jar ] || bash "$GITHUB_ACTION_PATH/limit.sh" 180 "Downloading Freerouting 2.1.0" curl -fsSL -o ~/tools/freerouting.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.1.0/freerouting-2.1.0.jar
        echo "FREEROUTING=$HOME/tools/freerouting.jar" >> "$GITHUB_ENV"
    - name: Freerouting 2.5.0 cache
      uses: actions/cache@v4
      with:
        path: ~/tools/freerouting-2.5.0.jar
        key: freerouting-2.5.0
    - name: Freerouting 2.5.0
      shell: bash
      run: |
        [ -f ~/tools/freerouting-2.5.0.jar ] || bash "$GITHUB_ACTION_PATH/limit.sh" 180 "Downloading Freerouting 2.5.0" curl -fsSL -o ~/tools/freerouting-2.5.0.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
    - name: Python packages
      shell: bash
      run: |
        bash "$GITHUB_ACTION_PATH/limit.sh" 300 "Installing the Python packages (pip)" \
            pip3 install -q --user --break-system-packages -r requirements.txt
        python3 -c "import pcbnew, cadquery; print('pcbnew', pcbnew.Version())"
        java -version
