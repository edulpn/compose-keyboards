# The check suites from docs/building.md ("Checking a change"), on GitHub's standard runners.
#
# A pull request runs only the suites its changes can affect: every full run on main records which repository
# files each suite read (.github/ci/traced.py), and the plan job compares that list with the files the pull
# request changes (.github/ci/plan.py). A docs-only change runs nothing.
# The suites are per layout: rev2-<layout> (case and firmware) and boards-<layout> for every folder of layouts/
# with a layout.py. The plan job hands each job below its list of layouts, so a new layout needs nothing here,
# and a change to one layout runs that layout's suites only.
# The controller is a suite of its own (it has no keyboard): when it runs the boards run with it, since the half
# boards are simulated against its board; a change to the boards alone builds that board and skips its SPICE job.
# Only the pull request's own changes count: what main gained between that full run and the pull request's base is
# main's own run to check.
# Pushes to main and manual runs always run everything.
#
# A design change moves the outputs on purpose, so they are compared with the base's and the result reported,
# failing nothing (case STLs, keyboard.json, the controller, and each half board that routes against
# the board routed before): a change meant to leave them alone has to read "identical".
#
# A half board is routed only when something its routing reads has changed since it was last routed
# clean (.github/ci/routed.py); otherwise that board is taken from the cache and goes through DRC, the copper
# simulation and the order check like a fresh one.
name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pictures:
        description: also make the docs' pictures (artifact pictures-<layout>; unzip it over the repository's root)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  T: python3 .github/ci/traced.py
  BASE_SHA: ${{ github.event.pull_request.base.sha }}    # .github/ci/base.py falls back on it

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run_rev2: ${{ steps.plan.outputs.run_rev2 }}
      run_boards: ${{ steps.plan.outputs.run_boards }}
      run_controller: ${{ steps.plan.outputs.run_controller }}
      rev2: ${{ steps.plan.outputs.rev2 }}          # the layouts each kind of suite runs for, as JSON lists
      boards: ${{ steps.plan.outputs.boards }}
      half: ${{ steps.plan.outputs.half }}          # the half-board jobs: {layout, board, shard, shards}
      suites: ${{ steps.plan.outputs.suites }}      # every suite and why it's skipped, for checks-passed
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/cache/restore@v6
        with: { path: deps, key: "deps-${{ github.sha }}", restore-keys: "deps-" }
      - run: python3 .github/ci/test_affected.py
      - run: python3 .github/ci/test_plan.py
      - run: python3 .github/ci/test_passed.py
      - run: python3 .github/ci/test_routed.py
      - run: python3 .github/ci/test_sameboard.py
      - run: python3 .github/ci/test_imports.py
      - run: python3 .github/ci/test_cli.py
      # every name the code takes from another of its modules exists (covers the commands no job below runs)
      - run: python3 .github/ci/imports.py
      - id: plan
        run: python3 .github/ci/plan.py deps

  # ---------------------------------------------------------------- per layout: case, fit checks, firmware
  rev2:
    needs: plan
    if: needs.plan.outputs.run_rev2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        layout: ${{ fromJSON(needs.plan.outputs.rev2) }}
    name: rev2 (${{ matrix.layout }})
    env: { LAYOUT: "${{ matrix.layout }}" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - run: $T deps/rev2-$LAYOUT.txt --layout $LAYOUT gasket-case o2
      - run: $T deps/rev2-$LAYOUT.txt --layout $LAYOUT gasket-checks o2
      - run: $T deps/rev2-$LAYOUT.txt --layout $LAYOUT firmware-rev2 o2
      # both keyboard.json files against QMK's own schema, as its master has it today
      - id: qmk
        continue-on-error: true
        uses: actions/checkout@v7
        with: { repository: qmk/qmk_firmware, path: qmk, sparse-checkout: data/schemas }
      - name: keyboard.json against QMK's schema
        run: |
          if [ ! -f qmk/data/schemas/keyboard.jsonschema ]; then
            echo "::notice::QMK's schemas could not be fetched: the keyboard.json files were not validated"; exit 0
          fi
          pip3 install -q --user --break-system-packages hjson "jsonschema>=4,<5"
          python3 .github/ci/qmk_schema.py qmk/data/schemas o2/firmware/keyboard.json o2/firmware/rgb/keyboard.json
      # A design change moves the outputs on purpose, so this reports and does not fail.
      # A change that is meant to leave them alone (a reorganisation, a new check) has to read "identical" here.
      - name: the same outputs as the base? (case STLs, both keyboard.json; reported)
        if: github.event_name == 'pull_request'
        run: |
          base=$(python3 .github/ci/base.py)
          git worktree add -q --detach "$RUNNER_TEMP/base" $base
          if ! (cd "$RUNNER_TEMP/base" && python3 -m compose --layout $LAYOUT gasket-case "$RUNNER_TEMP/b2" \
                && python3 -m compose --layout $LAYOUT firmware-rev2 "$RUNNER_TEMP/b2") > "$RUNNER_TEMP/base.log" 2>&1; then
            tail -5 "$RUNNER_TEMP/base.log"
            echo "::notice::$LAYOUT rev 2: the base ${base:0:9} did not build here, so there is nothing to compare with"; exit 0
          fi
          differ=""
          for f in $( (cd o2 && ls print/*.stl firmware/keyboard.json firmware/rgb/keyboard.json
                       cd "$RUNNER_TEMP/b2" && ls print/*.stl firmware/keyboard.json firmware/rgb/keyboard.json) 2>/dev/null | sort -u); do
            cmp -s "o2/$f" "$RUNNER_TEMP/b2/$f" || differ="$differ $f"
          done
          if [ -z "$differ" ]; then
            msg="$LAYOUT rev 2: $(ls o2/print/*.stl | wc -l | tr -d ' ') STLs and both keyboard.json identical to the base ${base:0:9}"
          else
            msg="$LAYOUT rev 2: outputs differ from the base ${base:0:9}:$differ"
            echo "::notice title=rev 2 outputs changed::$msg"
          fi
          echo "$msg"; echo "**$msg**" >> "$GITHUB_STEP_SUMMARY"
      - name: section drawings
        run: $T deps/rev2-$LAYOUT.txt --layout $LAYOUT gasket-sections o2
      # Every job names its folder. One command without: it has to go to the layout's own folder under out/ and
      # write the same files there.
      - name: a command with no folder named
        run: |
          $T deps/rev2-$LAYOUT.txt --layout $LAYOUT firmware-rev2
          cmp out/$LAYOUT/rev2/firmware/keyboard.json o2/firmware/keyboard.json
          cmp out/$LAYOUT/rev2/firmware/rgb/keyboard.json o2/firmware/rgb/keyboard.json
          echo "$LAYOUT: firmware-rev2 with no folder named wrote out/$LAYOUT/rev2, the same files as with one"
      - uses: actions/upload-artifact@v7
        with: { name: "deps-rev2-${{ matrix.layout }}", path: deps, retention-days: 7 }

  # ---------------------------------------------------------------- rev 2 boards: route, DRC, copper and circuit sims
  # The controller's board is built whenever the boards run (boards-sim reads it), and the boards run whenever
  # the controller suite does (plan.py): run_boards covers both. Its SPICE job runs with the controller suite only.
  controller:
    needs: plan
    if: needs.plan.outputs.run_boards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      # The base's controller first, and into the folder this run's own goes to: the job file the router is handed
      # holds its own path, and "the same job" below is that file byte for byte.
      - name: the base's controller, to compare with
        if: github.event_name == 'pull_request'
        run: |
          base=$(python3 .github/ci/base.py)
          git worktree add -q --detach "$RUNNER_TEMP/base" $base
          mkdir -p "$RUNNER_TEMP/was"
          if (cd "$RUNNER_TEMP/base" && python3 -m compose controller "$GITHUB_WORKSPACE/o2") > "$RUNNER_TEMP/base.log" 2>&1; then
            tail -1 "$RUNNER_TEMP/base.log"
            cp o2/pcb/controller_rev2.kicad_pcb o2/pcb/controller_rev2.dsn o2/pcb/controller_rev2.ses \
               o2/pcb/controller_rev2_freerouting.log "$RUNNER_TEMP/was/"
          else
            tail -5 "$RUNNER_TEMP/base.log"
            echo "::notice::controller: the base ${base:0:9} did not build here, so there is nothing to compare with"
          fi
          rm -rf o2
      - run: $T deps/controller.txt controller o2
      - run: $T deps/controller.txt sim-controller o2
      # Reported, not failed, like the half boards': a design change moves copper on purpose. A change meant to
      # leave the controller alone has to read "the same job" and "the same board" or "the same routing" here.
      - name: the same controller as the base's? (reported)
        if: github.event_name == 'pull_request'
        run: |
          base=$(python3 .github/ci/base.py)
          [ -f "$RUNNER_TEMP/was/controller_rev2.kicad_pcb" ] || { echo "controller_rev2: no board from the base to compare with"; exit 0; }
          python3 .github/ci/sameboard.py "$RUNNER_TEMP/was/controller_rev2.kicad_pcb" o2/pcb/controller_rev2.kicad_pcb \
              name=controller_rev2 was="built from the base ${base:0:9}" at=${base:0:9}
      - uses: actions/upload-artifact@v7
        with: { name: board-controller-s1, path: o2/pcb, retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with: { name: deps-controller, path: deps, retention-days: 7 }

  spice:
    needs: [plan, controller]
    if: needs.plan.outputs.run_controller == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: board-controller-s1, path: o2/pcb }
      - uses: ./.github/actions/setup
      - run: $T deps/controller.txt spice-controller o2
      - uses: actions/upload-artifact@v7
        with: { name: deps-controller-spice, path: deps, retention-days: 7 }

  half:
    needs: plan
    if: needs.plan.outputs.run_boards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # One job per board when its layout names a router that gives the same board every time it is put the same
        # job (Freerouting 2.5.0; Compose58's four): more jobs of one board would come back with the same answer.
        # A board on the default router, 2.1.0, which is random, races instead: three jobs (shard 1, 2, 3 of
        # shards 3), each running four routers per attempt for 55 minutes, and boards-sim takes the first clean
        # one; on the RGB boards 2.1.0 once took 30 attempts in vain. The bar is the same either way: DRC clean,
        # then the copper simulation. The plan job works the list out (.github/ci/plan.py).
        include: ${{ fromJSON(needs.plan.outputs.half) }}
    name: half (${{ matrix.layout }} ${{ matrix.board }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    env: { BOARD: "${{ matrix.board }}", LAYOUT: "${{ matrix.layout }}" }
    steps:
      - uses: actions/checkout@v7
      # The board as an earlier run routed it (this branch's newest, else main's), with the record of everything
      # that route read. It stands in for a fresh route only if none of that has changed (.github/ci/routed.py),
      # KiCad is the same version and the board still passes DRC here. Otherwise the board is routed as before.
      - uses: actions/cache/restore@v6
        with:
          path: |
            o2/pcb/${{ matrix.board }}*
            o2/routed
          key: routed-${{ matrix.layout }}-${{ matrix.board }}-newest   # nothing is saved under this name: the newest below is taken
          restore-keys: routed-${{ matrix.layout }}-${{ matrix.board }}-
      - id: cached
        run: python3 .github/ci/routed.py verify o2/routed/$BOARD.json board=$BOARD quiet=1
      - uses: ./.github/actions/setup
      - id: reuse
        if: steps.cached.outputs.reuse == 'true'
        run: |
          python3 .github/ci/routed.py verify o2/routed/$BOARD.json board=$BOARD deps=deps/boards-$LAYOUT.txt \
              kicad="$(python3 -c 'import pcbnew; print(pcbnew.Version())')" | tee verdict.txt
          grep -q ": reused" verdict.txt || exit 0
          python3 - <<'EOF'
          import os, sys
          sys.argv = ["drc", "o2"]
          import pcbnew
          from compose.pcb import toolbox as PK
          name = os.environ["BOARD"]
          err, warn, unc, rep = PK.drc(pcbnew.LoadBoard(os.path.join(PK.PCB_OUT, name + ".kicad_pcb")), name)
          print(f"{name}, reused: DRC {err} errors, {warn} warnings, {unc} unconnected")
          if err == 0 and unc == 0:
              open(os.environ["GITHUB_OUTPUT"], "a").write("clean=true\n")
          else:
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"**{name}**: the reused board fails DRC here ({err} errors, {unc} unconnected): routing it again\n")
          EOF
      - id: route
        name: route the board      # passed.py lists it as a part skipped when the board above was reused
        if: steps.reuse.outputs.clean != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/was"; mkdir -p "$RUNNER_TEMP/was"      # the board as it was routed before, to compare with
          cp o2/pcb/$BOARD.kicad_pcb o2/pcb/$BOARD.dsn o2/pcb/$BOARD.ses o2/pcb/${BOARD}_freerouting.log o2/routed/$BOARD.json \
              "$RUNNER_TEMP/was/" 2>/dev/null || true
          rm -rf o2 deps
          if [ "${{ matrix.shards }}" = 1 ]; then      # the board's own job: no clean route fails it
            timeout --signal=INT 55m $T deps/boards-$LAYOUT.txt --layout $LAYOUT half-rev2 o2 $BOARD \
              || { echo "::error::$BOARD: no clean route (10 attempts, 30 for an RGB board, or 55 minutes)"; exit 1; }
            echo "routed=true" >> "$GITHUB_OUTPUT"
          elif ROUTER_JOBS=4 timeout --signal=INT 55m $T deps/boards-$LAYOUT.txt --layout $LAYOUT half-rev2 o2 $BOARD; then
            echo "routed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BOARD shard ${{ matrix.shard }}: no clean route in 55 minutes; boards-sim takes another shard's"
          fi
      - id: record
        if: steps.route.outputs.routed == 'true'
        run: |
          python3 .github/ci/routed.py record deps/boards-$LAYOUT.txt o2/routed/$BOARD.json \
              commit=${{ github.event.pull_request.head.sha || github.sha }} run=${{ github.run_id }} \
              kicad="$(python3 -c 'import pcbnew; print(pcbnew.Version())')"
      # Freerouting 2.5.0 routes the same job the same way, and its optimizer then finishes that routing in one of
      # a few ways. Routing again because a file moved or the workflow changed should therefore end in the board
      # there was, or in the same routing finished another way: .github/ci/sameboard.py says which, from the job
      # (.dsn and how the router was called), the router's log and the boards. Reported, not failed: a design
      # change differs on purpose.
      - name: the same board as the one routed before? (reported)
        if: steps.route.outputs.routed == 'true'
        run: |
          was="$RUNNER_TEMP/was"
          [ -f "$was/$BOARD.kicad_pcb" ] && [ -f "$was/$BOARD.dsn" ] || { echo "$BOARD: no earlier board to compare with"; exit 0; }
          from=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('extra', {}).get('commit', '?')[:9])" "$was/$BOARD.json" 2>/dev/null || echo "?")
          python3 .github/ci/sameboard.py "$was/$BOARD.kicad_pcb" o2/pcb/$BOARD.kicad_pcb name=$BOARD was="routed at $from" at=$from
      - if: steps.record.outputs.key
        uses: actions/cache/save@v6
        with:
          path: |
            o2/pcb/${{ matrix.board }}*
            o2/routed
          key: routed-${{ matrix.layout }}-${{ matrix.board }}-${{ steps.record.outputs.key }}
      - if: steps.route.outputs.routed == 'true' || steps.reuse.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with: { name: "board-${{ matrix.layout }}-${{ matrix.board }}-s${{ matrix.shard }}", path: "o2/pcb/${{ matrix.board }}*", retention-days: 7 }
      # no clean route: the attempt that came closest (board, DRC report, router job), to see which nets were left
      - if: always() && steps.route.outcome != 'skipped' && steps.route.outputs.routed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "failed-${{ matrix.layout }}-${{ matrix.board }}-s${{ matrix.shard }}"
          path: "o2/pcb/failed/${{ matrix.board }}*"
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "deps-boards-${{ matrix.layout }}-${{ matrix.board }}-s${{ matrix.shard }}"
          path: deps
          retention-days: 7
          if-no-files-found: ignore

  boards-sim:
    needs: [plan, controller, half]
    if: needs.plan.outputs.run_boards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: ${{ fromJSON(needs.plan.outputs.boards) }}
    name: boards-sim (${{ matrix.layout }})
    env: { CTRL_OUT: o2, LAYOUT: "${{ matrix.layout }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "board-${{ matrix.layout }}-*", path: boards }
      - uses: actions/download-artifact@v8
        with: { name: board-controller-s1, path: boards/board-controller-s1 }
      - name: one routed copy of every board
        run: |
          mkdir -p o2/pcb
          for b in controller $LAYOUT-half_rev2_hotswap $LAYOUT-half_rev2_solder $LAYOUT-half_rev2_hotswap_rgb \
                   $LAYOUT-half_rev2_solder_rgb; do
            d=$(ls -d boards/board-$b-s* 2>/dev/null | sort | head -1)
            [ -n "$d" ] || { echo "::error::no routed board for $b (see its job's log)"; exit 1; }
            echo "$b: $d"; cp -r "$d"/. o2/pcb/
          done
      - uses: ./.github/actions/setup
      - run: $T deps/boards-$LAYOUT.txt --layout $LAYOUT sim-half-rev2 o2
      - run: $T deps/boards-$LAYOUT.txt --layout $LAYOUT order-rev2 o2
      - uses: actions/upload-artifact@v7
        with: { name: "deps-boards-${{ matrix.layout }}-sim", path: deps, retention-days: 7 }

  # ---------------------------------------------------------------- the docs' pictures, on a manual run that asks
  # The renders check nothing, so they are not a suite and fail nothing (checks-passed waits on it to list it). It takes the boards this
  # run routed, renders the assembly (gasket-render) and writes the pictures the docs show under their repository
  # paths (docs-pictures): the artifact pictures-<layout>, to unzip over the repository's root. renders-<layout>
  # holds every gasket-render view.
  pictures:
    needs: [plan, controller, half]
    if: github.event_name == 'workflow_dispatch' && inputs.pictures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        layout: ${{ fromJSON(needs.plan.outputs.boards) }}
    name: pictures (${{ matrix.layout }})
    env: { CTRL_OUT: o2, LAYOUT: "${{ matrix.layout }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "board-${{ matrix.layout }}-*", path: boards }
      - uses: actions/download-artifact@v8
        with: { name: board-controller-s1, path: boards/board-controller-s1 }
      - name: one routed copy of every board
        run: |
          mkdir -p o2/pcb
          for b in controller $LAYOUT-half_rev2_hotswap $LAYOUT-half_rev2_solder $LAYOUT-half_rev2_hotswap_rgb \
                   $LAYOUT-half_rev2_solder_rgb; do
            d=$(ls -d boards/board-$b-s* 2>/dev/null | sort | head -1)
            [ -n "$d" ] || { echo "::error::no routed board for $b (see its job's log)"; exit 1; }
            echo "$b: $d"; cp -r "$d"/. o2/pcb/
          done
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Node packages and Playwright's Chromium
        run: |
          cd compose/render/web
          bash "$GITHUB_WORKSPACE/.github/actions/setup/limit.sh" 300 "Installing the Node packages (npm)" npm install --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/.github/actions/setup/limit.sh" 600 "Installing Playwright's Chromium" npx playwright install --with-deps chromium
      - run: python3 -m compose --layout $LAYOUT gasket-render o2
      - run: python3 -m compose --layout $LAYOUT docs-pictures o2
      - uses: actions/upload-artifact@v7
        with: { name: "pictures-${{ matrix.layout }}", path: o2/docs-pictures, retention-days: 7 }
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: "renders-${{ matrix.layout }}", path: o2/png, retention-days: 7, if-no-files-found: ignore }

  # ---------------------------------------------------------------- one status to require, and the record for PRs
  # Every suite listed as passed, failed or skipped, with the plan's reason for each skip (.github/ci/passed.py):
  # a run that skipped everything doesn't read like one where everything ran. A skipped suite fails nothing.
  # pictures is listed too, and waited on for that, but it checks nothing and never fails this job.
  checks-passed:
    needs: [plan, rev2, controller, spice, half, boards-sim, pictures]
    if: always()
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }    # to list this run's jobs, one per layout
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/ci }
      - name: every suite that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PICTURES: ${{ github.event_name == 'workflow_dispatch' && inputs.pictures }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ci/passed.py

  # always(): without a status function a job is skipped when any job behind it was, however far back. A job that
  # is skipped on main must not cost the record.
  record-deps:
    needs: checks-passed
    if: always() && needs.checks-passed.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: "deps-*", path: in }
      - name: merge each suite's dependency lists
        run: |
          mkdir deps
          for s in $(ls in/deps-*/*.txt | xargs -n1 basename | sort -u); do      # one list per suite, from all its jobs
            cat in/deps-*/"$s" | sort -u > "deps/$s"
            # how many entries, and from where: files by their top folder, and the module names looked for
            echo "$(wc -l < "deps/$s") deps/$s: $(sed -E 's|^import:.*|module names|; s|/.*||' "deps/$s" | sort | uniq -c | sort -rn \
                 | awk '{n = $1; $1 = ""; printf "%s%s%s", sep, n, $0; sep = ", "}')"
          done
          echo "${{ github.sha }}" > deps/SHA
      - uses: actions/cache/save@v6
        with: { path: deps, key: "deps-${{ github.sha }}" }
